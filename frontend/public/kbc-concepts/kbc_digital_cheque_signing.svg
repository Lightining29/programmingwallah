<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="stageBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#14102d"/>
      <stop offset="60%" stop-color="#080714"/>
      <stop offset="100%" stop-color="#020108"/>
    </radialGradient>
    <linearGradient id="chequeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)"/>
      <stop offset="50%" stop-color="rgba(240, 248, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.14)"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Atmospheric Broadcast Studio Arena -->
  <rect width="1280" height="720" fill="url(#stageBg)"/>

  <!-- Golden Stage Light Cones -->
  <polygon points="640,-50 140,720 1140,720" fill="#f59e0b" opacity="0.08"/>
  <polygon points="200,-50 40,720 540,720" fill="#38bdf8" opacity="0.06"/>
  <polygon points="1080,-50 740,720 1240,720" fill="#38bdf8" opacity="0.06"/>

  <!-- Drifting Confetti Sparkles -->
  <rect x="220" y="140" width="12" height="18" fill="#fbbf24" transform="rotate(25 220 140)" opacity="0.8"/>
  <rect x="360" y="90" width="15" height="10" fill="#f87171" transform="rotate(-40 360 90)" opacity="0.75"/>
  <rect x="940" y="120" width="14" height="20" fill="#34d399" transform="rotate(35 940 120)" opacity="0.8"/>
  <rect x="1050" y="210" width="16" height="12" fill="#fbbf24" transform="rotate(-20 1050 210)" opacity="0.85"/>
  <circle cx="290" cy="240" r="4" fill="#fef08a" opacity="0.9"/>
  <circle cx="980" cy="290" r="4.5" fill="#fef08a" opacity="0.9"/>
  <circle cx="640" cy="110" r="5" fill="#38bdf8" opacity="0.85"/>

  <!-- Holographic Cheque Floating Shadow -->
  <ellipse cx="640" cy="620" rx="460" ry="25" fill="#000000" opacity="0.65"/>

  <!-- THE HOLOGRAPHIC TRANSPARENT CHEQUE SLAB -->
  <g transform="translate(180, 160)">
    <!-- Glass Slab Body -->
    <rect width="920" height="420" rx="24" fill="url(#chequeGlass)" stroke="url(#goldBorder)" stroke-width="4" filter="url(#goldGlow)"/>
    <!-- Glass Inner Border -->
    <rect x="12" y="12" width="896" height="396" rx="16" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- Bank Watermark Logo Center -->
    <g transform="translate(460, 210)" opacity="0.08">
      <circle r="120" fill="none" stroke="#ffffff" stroke-width="8"/>
      <polygon points="0,-100 86,50 -86,50" fill="none" stroke="#ffffff" stroke-width="6"/>
      <polygon points="0,100 86,-50 -86,-50" fill="none" stroke="#ffffff" stroke-width="6"/>
    </g>

    <!-- Top Bank Header -->
    <text x="50" y="60" font-family="'Cinzel', serif" font-size="24" font-weight="900" fill="#fef08a" letter-spacing="3">
      BANK OF KAUN BANEGA CROREPATI
    </text>
    <text x="50" y="82" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="2">
      OFFICIAL GRAND HOTSEAT CHAMPIONSHIP REWARD BRANCH
    </text>

    <!-- Date Box -->
    <rect x="680" y="38" width="190" height="42" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="700" y="64" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#fef08a">
      DATE: 2026-11-01
    </text>

    <!-- Payee Row -->
    <text x="50" y="150" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#94a3b8" letter-spacing="2">
      PAY TO:
    </text>
    <line x1="140" y1="155" x2="870" y2="155" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <text x="160" y="148" font-family="'Cinzel', serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">
      MANISH KUMAR (KBC GRAND TOP SCORER)
    </text>

    <!-- Rupees in Words -->
    <text x="50" y="220" font-family="'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#94a3b8" letter-spacing="2">
      RUPEES:
    </text>
    <line x1="140" y1="225" x2="870" y2="225" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <text x="160" y="218" font-family="'Playfair Display', serif" font-size="22" font-style="italic" font-weight="700" fill="#fef08a">
      Rupees Seven Crore Only (₹ 7,00,00,000/-)
    </text>

    <!-- Amount Display Box -->
    <rect x="520" y="270" width="350" height="70" rx="14" fill="rgba(6, 78, 59, 0.85)" stroke="#34d399" stroke-width="3" filter="url(#goldGlow)"/>
    <text x="545" y="318" font-family="'Montserrat', monospace" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="3">
      ₹ 7,00,00,000/-
    </text>

    <!-- Amitabh Bachchan Signature Area -->
    <path d="M 120 340 Q 180 300, 240 330 T 320 310 T 360 340" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.9"/>
    <line x1="80" y1="355" x2="380" y2="355" stroke="#94a3b8" stroke-width="1"/>
    <text x="140" y="375" font-family="'Cinzel', serif" font-size="12" font-weight="900" fill="#f59e0b" letter-spacing="2">
      AMITABH BACHCHAN (HOST)
    </text>
  </g>

  <!-- Luminous Digital Gold Stylus Pen in Action -->
  <g transform="translate(560, 480) rotate(-40)">
    <rect x="0" y="0" width="22" height="170" rx="8" fill="url(#goldBorder)" stroke="#ffffff" stroke-width="1.5" filter="url(#goldGlow)"/>
    <!-- Pen Tip Glow -->
    <polygon points="11,195 2,170 20,170" fill="#fef08a"/>
    <circle cx="11" cy="195" r="7" fill="#ffffff" filter="url(#goldGlow)"/>
  </g>

  <!-- Bottom Interactive Presentation Banner -->
  <rect x="360" y="650" width="560" height="42" rx="21" fill="#0b132e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="640" y="677" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    🏆 OFFICIAL CERTIFICATE & PRIZE CHEQUE PRESENTATION 🏆
  </text>
</svg>